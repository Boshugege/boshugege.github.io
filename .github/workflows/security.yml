name: Security Checks

# CodeQL code scanning and a dependency audit, on the self-hosted runner.
# Runs after every production deploy, weekly (to catch newly published
# advisories) and on demand. Never on pull requests: this public repository
# must not run outside code on the runner (the runner's job guard enforces
# this, see SERVER.md 5.2). Actions are pinned to commit SHAs because they
# execute on the production host.
on:
  workflow_run:
    workflows: ["Verify and Deploy Site"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # Mondays 11:23 Asia/Shanghai
  workflow_dispatch:

concurrency:
  group: security-checks
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JavaScript / TypeScript)
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: [self-hosted, linux, x64, pnc-blog]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:javascript-typescript
          ref: refs/heads/main
          sha: ${{ github.event.workflow_run.head_sha || github.sha }}

  npm-audit:
    name: npm audit
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)))
    runs-on: [self-hosted, linux, x64, pnc-blog]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      # Reads package-lock.json only; nothing is installed or executed.
      - name: Audit locked dependencies
        run: npm audit --audit-level=low
