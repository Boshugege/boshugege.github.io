name: Verify and Deploy Site

# Everything runs on the self-hosted runner on `personal`; no GitHub-hosted
# machines. deploy.sh checks out the commit in a temporary worktree and runs
# `npm run verify` (typecheck, tests, build, static checks) once, then
# publishes that same build, so nothing is built twice.
#
# This repository is public. Never add `pull_request` / `pull_request_target`
# triggers here. That alone does not keep forks off the runner, though: a fork
# PR can carry its own workflow file. Two settings outside this file do:
# fork PR runs need a maintainer's approval (all external contributors), and
# the runner's job-started hook refuses any job that is not a push, manual,
# scheduled or workflow_run job on main of this repository (SERVER.md, 6.1).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: "要部署的提交 SHA（留空 = 当前 main；填写 main 上的历史提交即可重部署 / 回滚）"
        required: false
        default: ""
        type: string

concurrency:
  group: pnc-blog-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy
    # Manual runs started from another branch run that branch's copy of this
    # file; only main's copy may deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, pnc-blog]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve commit
        id: target
        env:
          INPUT_SHA: ${{ inputs.deploy_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          sha="${INPUT_SHA:-$EVENT_SHA}"
          sha="$(printf '%s' "$sha" | tr -d '[:space:]' | tr 'A-F' 'a-f')"
          if [[ ! "$sha" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::deploy_sha must be a 7-40 character hex commit SHA, got: $sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      - name: Verify, build and deploy
        env:
          DEPLOY_SHA: ${{ steps.target.outputs.sha }}
        run: /home/lyy/services/pnc-blog/deploy.sh
