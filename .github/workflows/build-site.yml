name: Verify Site

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: site-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, pnc-blog]
    timeout-minutes: 20
    steps:
      - name: Deploy verified commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: /home/lyy/services/pnc-blog/deploy.sh
